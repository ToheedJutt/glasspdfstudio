{% extends "layout.html" %}

{% block title %}Sign in — {{ APP_NAME }}{% endblock %}
{% block body_class %}page-auth{% endblock %}

{% block main %}
  <section class="auth">
    <div class="container">
      <h1>Sign in</h1>
      <form method="post" class="glass-card">
        <div class="field">
          <label class="field__label">Email</label>
          <input class="field__control" type="email" name="email" required>
        </div>
        <div class="field">
          <label class="field__label">Password</label>
          <input class="field__control" type="password" name="password" required>
        </div>
        <button class="btn btn--primary" type="submit">Sign in</button>
      </form>
      <p><a href="{{ url_for('auth.forgot') }}">Forgot password?</a></p>
      <p>New here? <a href="{{ url_for('auth.signup') }}">Create an account</a></p>
    </div>
  </section>
{% endblock %}
