{% extends "layout.html" %}

{% block title %}Verify account — {{ APP_NAME }}{% endblock %}
{% block body_class %}page-auth{% endblock %}

{% block main %}
  <section class="auth">
    <div class="container">
      <h1>Verify your account</h1>
      <p>Enter the verification code sent to <strong>{{ email.rstrip('.') if email else '' }}</strong></p>
      <form method="post" class="glass-card">
        <input type="hidden" name="email" value="{{ email.rstrip('.') if email else '' }}">
        <div class="field">
          <label class="field__label">Verification code</label>
          <input class="field__control" type="text" name="otp" autocomplete="one-time-code" required>
        </div>
        <div style="display:flex;gap:.7rem;align-items:center">
          <button class="btn btn--primary" type="submit">Verify</button>
          <button class="btn btn--ghost" type="submit" name="resend" value="1">Resend code</button>
        </div>
      </form>
    </div>
  </section>
{% endblock %}
