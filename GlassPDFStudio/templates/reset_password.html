{% extends "layout.html" %}

{% block title %}Set new password — {{ APP_NAME }}{% endblock %}
{% block body_class %}page-auth{% endblock %}

{% block main %}
  <section class="auth">
    <div class="container">
      <h1>Set a new password</h1>
      <p>Enter the code sent to <strong>{{ email }}</strong> and choose a new password.</p>
      <form method="post" class="glass-card">
        <input type="hidden" name="email" value="{{ email }}">
        <div class="field">
          <label class="field__label">Verification code</label>
          <input class="field__control" type="text" name="otp" required>
        </div>
        <div class="field">
          <label class="field__label">New password</label>
          <input class="field__control" type="password" name="password" required>
        </div>
        <div style="display:flex;gap:.7rem;align-items:center">
          <button class="btn btn--primary" type="submit">Set password</button>
          <button class="btn btn--ghost" type="submit" name="resend" value="1">Resend code</button>
        </div>
      </form>
    </div>
  </section>
{% endblock %}
